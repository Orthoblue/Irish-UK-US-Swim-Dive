title: Irish-UK-US Swim Dive
description: >-
  Swimming and diving news and results from Ireland, the United Kingdom,
  and the United States, including Auburn meet recaps.
url: "https://orthoblue.github.io"
baseurl: "/Irish-UK-US-Swim-Dive"
timezone: UTC
markdown: kramdown
permalink: pretty
future: true
# GitHub Pages would otherwise apply the Primer theme.
theme: null
kramdown:
  input: GFM
  hard_wrap: false
# Keep the duplicate Markdown title in the source file. Layouts hide a
# leading h1 when front matter already has a title.
titles_from_headings:
  enabled: true
  strip_title: false
  collections: false
exclude:
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
defaults:
  - scope:
      path: "articles"
      type: "pages"
    values:
      layout: article
      body_class: article
  - scope:
      path: "diving/articles"
      type: "pages"
    values:
      layout: article
      body_class: article
      kicker: "Diving weekly"
